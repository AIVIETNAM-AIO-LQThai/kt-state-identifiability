# Experiment 5 CONFIRMATORY run (X5-D06, X5-D07, X5-D08). Master seed 20265101 (Stage-0 audit 20265001 and pilot 20265002 are not reused).
# Cells E1-E6; lambda == 1 everywhere; 2PL fits (B1, B2) with the X4-D08/D09 polish, plus the carry-over score test at the B2 and B1 fits for tau_x in
# taus_x (primary 2). E4 runs as a `warp` unit: the fit plus ONE bootstrap replicate from the fitted null.
# Rule set: state_dependence/rules.py (G1-G3, H5a-H5e). Do not edit after `frozen: true`; the runner needs --frozen-sha256.
stage: confirmatory
frozen: true
master_seed: 20265101
n_starts: 5
taus_x: [2.0, 5.0, 10.0]
null_reference: results/experiment_04/confirmatory/88d74ed991      # Experiment 4 V2 2PL T* (X5-D03)
stage0_summary: results/experiment_05/stage0/summary.json
scenarios:
  - {id: E1, base: S1}                                             # F present, no feedback
  - {id: E2, base: S2}                                             # F absent, no feedback
  - {id: E3, base: S2, feedback: {kappa: -0.25, tau_D: 10.0}}      # no F, S7-strength feedback
  - {id: E4, base: S2, feedback: {kappa: -0.10, tau_D: 2.0}}       # no F, weak short feedback
  - {id: E5, base: S1, feedback: {kappa: -0.25, tau_D: 10.0}}      # F + feedback (= S7)
  - {id: E6, base: S8n}                                            # no F, lognormal gains (non-feedback misfit)
fit:
  scenarios: [E1, E2, E3, E5, E6]
  N_list: [300, 1000]
  rep_range: {E1: [0, 75], E2: [0, 75], E3: [0, 30], E5: [0, 30], E6: [0, 50]}
warp:
  scenarios: [E4]
  N_list: [300, 1000]
  rep_range: {E4: [0, 50]}
job_order: rep_major                                               # replication-major across cells and N: a cap stop leaves the cells balanced
# mean seconds per job from the pilot (docs/experiment_05_pilot_report.md: E1 731, E2 709, E3 965, E4 1,225, E5 926, E6 466) x 1.4 load factor (X4-D11)
cost_model_sec: {E1: 1023, E2: 993, E3: 1351, E4: 1715, E5: 1296, E6: 652, default: 1351}
budget: {max_cpu_hours: 210, enforce_cpu_cap: true, workers: 18}
